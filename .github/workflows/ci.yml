name: CI

# The project's own baseline, exactly as CONTRIBUTING.md states it: the pytest suite, the UI
# reference audit, and the UI selftests — plus a dependency audit against the lockfile.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the repository — no secrets, no write scopes.
# (The default token would otherwise carry whatever the repository settings allow.)
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # Actions are pinned to immutable commit SHAs (the release tag is in the comment): a
      # moved or retagged upstream tag cannot silently change what this workflow executes.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev extras)
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]

      - name: Pytest suite
        run: python -m pytest orderflow_system -q

      - name: UI reference audit (JS -> FastAPI routes / DOM ids)
        run: python scripts/audit_ui_refs.py

      - name: UI selftests (each prints "N ok, 0 failed")
        shell: bash
        run: |
          for f in orderflow_system/desktop/ui/*.selftest.js; do
            printf '%-46s ' "$(basename "$f")"
            node "$f" | tail -1
          done

      - name: Lint baseline (ruff, pinned to the CONTRIBUTING version)
        run: |
          python -m pip install "ruff==0.16.7"
          ruff check orderflow_system scripts

      - name: Dependency audit (pip-audit over the locked set + the mt5 extra the portable build ships)
        run: |
          python -m pip install "uv==0.12.8" "pip-audit==2.10.1"
          uv export --frozen --no-hashes --no-emit-project --extra mt5 --output-file requirements.audit.txt
          python -m pip_audit -r requirements.audit.txt

      - name: SBOM (CycloneDX 1.5, from the lockfile + the mt5 extra the portable build ships)
        run: uv export --frozen --format cyclonedx1.5 --extra mt5 --output-file sbom.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: sbom-cyclonedx-${{ matrix.python-version }}
          path: sbom.cdx.json
