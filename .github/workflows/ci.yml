name: CI

# Guardrails for the live/demo boundary (audit P1) and the UI reference audit.
# Both commands are the project's own baseline: see CONTRIBUTING.md.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (dev extras)
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]

      - name: Pytest suite
        run: python -m pytest orderflow_system -q

      - name: UI reference audit
        run: python scripts/audit_ui_refs.py
